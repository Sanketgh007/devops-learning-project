[app_servers]
app-server-1 ansible_host=YOUR_SERVER_IP ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/your-key.pem

[app_servers:vars]
ansible_python_interpreter=/usr/bin/python3

[monitoring]
monitoring-server ansible_host=YOUR_MONITORING_IP ansible_user=ec2-user

[all:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
