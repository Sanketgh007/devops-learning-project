---
# Ansible playbook to deploy the application

- name: Deploy DevOps Learning Application
  hosts: app_servers
  become: yes
  
  vars:
    app_dir: /opt/devops-learning
    repo_url: https://github.com/yourusername/devops-learning.git
    docker_compose_version: "2.23.0"
  
  tasks:
    - name: Update system packages
      yum:
        name: '*'
        state: latest
        update_cache: yes
      when: ansible_os_family == "RedHat"
    
    - name: Install required packages
      yum:
        name:
          - git
          - python3
          - python3-pip
          - docker
        state: present
      when: ansible_os_family == "RedHat"
    
    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes
    
    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
    
    - name: Install Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-{{ ansible_system }}-{{ ansible_architecture }}"
        dest: /usr/local/bin/docker-compose
        mode: '0755'
    
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
    
    - name: Clone or update repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes
      become_user: "{{ ansible_user }}"
    
    - name: Stop existing containers
      command: docker-compose -f {{ app_dir }}/docker/docker-compose.yml down
      args:
        chdir: "{{ app_dir }}"
      ignore_errors: yes
    
    - name: Build and start containers
      command: docker-compose -f {{ app_dir }}/docker/docker-compose.yml up -d --build
      args:
        chdir: "{{ app_dir }}"
    
    - name: Wait for application to be ready
      uri:
        url: "http://localhost:5000/health"
        status_code: 200
      register: result
      until: result.status == 200
      retries: 10
      delay: 5
    
    - name: Display deployment info
      debug:
        msg: "Application deployed successfully at http://{{ ansible_host }}:5000"
